<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tally</title>
<meta name="description" content="Scorekeeper for family card, board, dice and yard games.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tally">
<meta name="theme-color" content="#f3f1ec">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#f3f1ec; --screen:#fbfaf7; --surface:#ffffff; --cell:#ece9e2; --ink:#1c2033; --muted:#646879; --line:#dedad1;
  --accent:#2f5bd3; --accent-ink:#ffffff; --atext:#2f5bd3; --soft:#e6ebf8; --lead:rgba(47,91,211,.09);
  --p1:#d6453c; --p2:#2f6fdb; --p3:#18936a; --p4:#d4961b; --good:#18936a; --bad:#c2410c; --gold:#d4961b;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,-apple-system,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13151d; --screen:#171a24; --surface:#1f2330; --cell:#272c3b; --ink:#eceef5; --muted:#9fa3b5; --line:#2f3445;
  --accent:#7d9cf5; --accent-ink:#10131c; --atext:#7d9cf5; --soft:#252c46; --lead:rgba(125,156,245,.12);
  --p1:#f0766d; --p2:#6f9bf2; --p3:#3fc290; --p4:#efb94a; --good:#3fc290; --bad:#f08a52; --gold:#efb94a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13151d; --screen:#171a24; --surface:#1f2330; --cell:#272c3b; --ink:#eceef5; --muted:#9fa3b5; --line:#2f3445;
  --accent:#7d9cf5; --accent-ink:#10131c; --atext:#7d9cf5; --soft:#252c46; --lead:rgba(125,156,245,.12);
  --p1:#f0766d; --p2:#6f9bf2; --p3:#3fc290; --p4:#efb94a; --good:#3fc290; --bad:#f08a52; --gold:#efb94a; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
body{min-height:100dvh;padding-bottom:calc(76px + var(--sb))}
body.playing{padding-bottom:calc(90px + var(--sb))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink)}
#app{max-width:640px;margin:0 auto}

.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(10px + var(--st)) 16px 10px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.top .tl,.top .tr{display:flex;gap:6px;align-items:center}
.top .tt{min-width:0}
.top .t{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{width:38px;height:38px;border-radius:12px;background:var(--cell);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:19px;flex:none}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.body{padding:4px 16px 20px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;text-align:left}
.cont{background:var(--accent);color:var(--accent-ink);border:0;width:100%}
.cont .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.85;font-weight:700}
.cont .v{font-family:var(--display);font-weight:800;font-size:20px}
.cont .d{font-size:14px;opacity:.92}
.tip{gap:6px;font-size:14px}.tip .sharei{display:inline-block;border:1.5px solid currentColor;border-radius:4px;padding:0 3px;font-size:11px}
.link{color:var(--atext);font-weight:700;font-size:14px;padding:6px 0;align-self:flex-start}
.link.wide{align-self:center}
.link.danger,.danger{color:var(--bad)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigbtn{border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);text-align:left;min-height:104px}
.bigbtn .n{font-family:var(--display);font-weight:800;font-size:18px;display:block}
.bigbtn .d{font-size:12.5px;color:var(--muted);display:block}
.bigbtn.wide{grid-column:span 2;flex-direction:row;align-items:center;justify-content:space-between;min-height:0}
.suits{font-size:24px;letter-spacing:3px;line-height:1.1}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:8px}
.lbl .muted{text-transform:none;letter-spacing:0;font-weight:400}
.muted{color:var(--muted)} .small{font-size:13px;margin:0} .center{text-align:center}
.empty{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.6}
.empty.small{padding:6px 0;text-align:left;margin:0;font-size:14px}

.ppl{display:flex;gap:8px;flex-wrap:wrap}
.pp{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:4px 12px 4px 4px;font-size:15px;font-weight:700;position:relative}
.pp.add{padding:7px 14px;color:var(--atext);border-style:dashed}
.pick .pp.sel{border-color:var(--accent);background:var(--soft)}
.pp .ord{position:absolute;top:-7px;right:-5px;background:var(--accent);color:var(--accent-ink);font-size:11px;width:19px;height:19px;border-radius:50%;display:grid;place-items:center}
.av{width:26px;height:26px;border-radius:50%;color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:700;flex:none;font-family:var(--body)}
.av.big{width:34px;height:34px;font-size:15px}
.favrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.fav{white-space:nowrap;background:var(--soft);color:var(--atext);font-weight:700;border-radius:12px;padding:9px 14px;font-size:15px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:space-around;border-top:1px solid var(--line);
  padding:7px 0 calc(8px + var(--sb));background:color-mix(in srgb,var(--screen) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);font-weight:700;min-width:64px;padding:2px 0}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar .on{color:var(--atext)}

.seg{display:flex;background:var(--cell);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;text-align:center;padding:8px 10px;border-radius:9px;font-weight:700;font-size:14px;color:var(--muted);white-space:nowrap}
.seg .on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.sm button{padding:6px 10px;font-size:13px}
.search,.txt,.num,.note{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px}
.search{background:var(--cell);border-color:transparent}
.txt.flat{border:0;background:transparent;padding:6px 4px;font-weight:700;flex:1;min-width:0}
.note{resize:vertical;min-height:52px}
.num{width:110px;text-align:right;font-variant-numeric:tabular-nums}
.glist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 12px}
.g{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px;text-align:left;width:100%}
.g:last-child{border-bottom:0}
.g > span:first-child:not(.h2h):not(.res),.gmain{display:flex;flex-direction:column;min-width:0;flex:1;text-align:left}
.gn{font-weight:700;font-size:16px;display:block}
.gr{font-size:13px;color:var(--muted);display:block}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:7px;background:var(--soft);color:var(--atext);white-space:nowrap;flex:none}
.star{font-size:22px;color:var(--muted);width:30px;flex:none}.star.on{color:var(--gold)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font-weight:700;font-size:15.5px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-style:dashed;color:var(--atext)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.big{font-family:var(--display);font-size:19px;padding:15px;margin-top:6px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.three .btn{padding:12px 6px;font-size:14px}
.row{display:flex;gap:8px;align-items:center}

.rule{font-size:15px;gap:6px}
.opts{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2px 14px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:15px}
.opt:last-child{border-bottom:0}
.body > .opt{border:0;padding:4px 0}
.tog{width:50px;height:30px;border-radius:99px;background:var(--cell);position:relative;flex:none;border:1px solid var(--line)}
.tog i{position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s}
.tog.on{background:var(--good);border-color:var(--good)}.tog.on i{left:23px}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.team{border-radius:14px;padding:10px 12px;background:color-mix(in srgb,var(--tc) 13%,var(--surface));border:1.5px solid color-mix(in srgb,var(--tc) 45%,transparent);display:flex;flex-direction:column;font-size:13px}
.team b{font-size:15px}
.radios{display:flex;flex-direction:column;gap:6px}
.radios button{text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.radios .on{border-color:var(--accent);background:var(--soft)}

/* score grid */
.grid{padding-inline:8px}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--surface);border:1px solid var(--line);border-radius:16px}
table.sheet{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:16px}
.sheet th{font-weight:700;font-size:13px;padding:10px 4px 8px;text-align:center;vertical-align:top;position:sticky;top:0;background:var(--surface);min-width:62px;border-bottom:1px solid var(--line)}
.sheet th .av{display:flex;margin:0 auto 4px}
.sheet th .nm{display:block;max-width:84px;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet th .phase{display:block;font-size:11px;color:var(--atext);margin-top:2px}
.sheet td{text-align:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.sheet tbody tr{cursor:pointer}
.sheet tbody tr:active td{background:var(--soft)}
.sheet td.r{color:var(--muted);font-size:12px;text-align:left;padding-left:10px;width:34px;white-space:nowrap}
.sheet td.z{color:var(--muted);opacity:.55}
.sheet .neg{color:var(--bad)}
.sheet .lead{background:var(--lead)}
.sheet tfoot td{border-bottom:0}
.sheet tr.tot td{font-family:var(--display);font-weight:800;font-size:21px;padding:10px 4px 12px}
.sheet tr.rw td{font-size:12.5px;color:var(--muted);padding:5px 4px;border-bottom:0}
.sheet .ph{font-style:normal;font-size:10px;color:var(--good);margin-left:2px;vertical-align:super}
.emptyrow{color:var(--muted);font-size:14px;padding:22px 12px!important;cursor:default}
.crown{color:var(--gold);font-size:13px;margin-left:2px}
.dealer{display:inline-block;font-size:10px;font-weight:700;background:var(--ink);color:var(--screen);border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.cat td.c,.cat th.c{text-align:left;font-size:14px;padding-left:12px;min-width:118px;position:sticky;left:0;background:var(--surface);z-index:1}
.cat td.c small{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
.cat td.cell{cursor:pointer;font-weight:700}
.cat td.cell small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.cat td.blank{color:var(--line);font-size:20px}
.cat tr.sub td{background:var(--cell);font-size:14px;font-weight:700}
.cat tr.sub small{display:block;font-size:10.5px;color:var(--muted);font-weight:400}
.ok{color:var(--good)}
.cat tbody tr{cursor:default}
.housenote{font-size:14px;color:var(--muted)}.housenote b{color:var(--ink);display:block}

.prog{display:flex;flex-direction:column;gap:7px}
.pr{display:grid;grid-template-columns:minmax(52px,auto) 1fr 48px;align-items:center;gap:10px;font-size:14px;font-variant-numeric:tabular-nums}
.pr > span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;display:flex;align-items:center;gap:6px}
.pr > span:last-child{text-align:right;font-weight:700}
.trk{height:9px;background:var(--cell);border-radius:9px;overflow:hidden;display:block}
.trk i{display:block;height:100%;border-radius:9px;transition:width .3s}
.prog.big .pr{font-size:15px}

.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--sb));width:min(608px,calc(100% - 32px));z-index:6;
  background:var(--accent);color:var(--accent-ink);border-radius:18px;text-align:center;padding:16px;font-weight:800;font-family:var(--display);font-size:19px;box-shadow:0 10px 26px -10px rgba(20,30,80,.55)}
.fab small{font-family:var(--body);font-weight:400;font-size:14px;opacity:.85}
.ghostfab{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:0 8px 20px -12px rgba(0,0,0,.4)}

/* counters */
.steps{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
.steps button{min-width:44px;padding:7px 10px;border-radius:10px;background:var(--cell);font-weight:700;font-variant-numeric:tabular-nums}
.steps .on{background:var(--ink);color:var(--screen)}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.counters.n1{grid-template-columns:1fr}
.ctr{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ctr.out{opacity:.45}
.ctr .cn{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;min-width:0}
.ctr .cn span:not(.av){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.outtag{font-size:11px;background:var(--bad);color:var(--surface);border-radius:5px;padding:0 5px}
.cv{font-family:var(--display);font-weight:800;font-size:44px;line-height:1;text-align:center;font-variant-numeric:tabular-nums;padding:6px 0}
.cv small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted);margin-top:3px}
.cb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cb button{background:var(--cell);border-radius:12px;padding:13px 0;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.cb button:last-child{background:color-mix(in srgb,var(--pc) 18%,var(--surface));color:var(--ink)}
.cb button:active{transform:scale(.96)}
.log{display:flex;flex-direction:column;gap:3px;font-size:14px;color:var(--muted)}

/* wins */
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.wt{background:var(--surface);border:1px solid var(--line);border-bottom:5px solid var(--pc);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
.wt:active{transform:scale(.97);background:color-mix(in srgb,var(--pc) 14%,var(--surface))}
.wt .wn{font-weight:700;font-size:15px}
.wt .wc{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.05;font-variant-numeric:tabular-nums}
.wt .wl{font-size:12px;color:var(--muted)}

/* bottom sheet */
#sheet{position:fixed;inset:0;z-index:20;background:rgba(10,12,20,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
#sheet[hidden]{display:none}
#sheet .panel{background:var(--screen);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + var(--sb));display:flex;flex-direction:column;gap:10px;max-height:92dvh;overflow-y:auto;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion: reduce){#sheet,#sheet .panel,.trk i{animation:none;transition:none}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto}
.sh-h{display:flex;align-items:center;gap:10px}.sh-h b{flex:1;font-family:var(--display);font-size:19px;font-weight:800}
.sh-h .ico{width:34px;height:34px;font-size:15px}
.who{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:7px}
.who button{border:2px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;font-size:13.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--surface)}
.who .sel{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 14%,var(--surface))}
.who.list{grid-template-columns:1fr;gap:5px;max-height:34dvh;overflow-y:auto}
.who.list button{flex-direction:row;padding:7px 10px;gap:9px;flex-wrap:wrap}
.who.list button span:not(.av):not(.phx){flex:1;text-align:left}
.who.list button b{font-family:var(--display);font-size:18px;font-variant-numeric:tabular-nums}
.phx{font-size:12px;border:1.5px solid var(--line);border-radius:8px;padding:3px 8px;color:var(--muted)}
.phx.on{background:var(--good);border-color:var(--good);color:var(--surface)}
.entry{display:flex;flex-direction:column;align-items:flex-end;padding:2px 6px;min-height:58px}
.entry small{align-self:flex-start;font-size:12.5px;color:var(--muted)}
.entry span{font-family:var(--display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;line-height:1.1;word-break:break-all;text-align:right}
.entry span i{font-style:normal;color:var(--line)}
.entry em{font-style:normal;color:var(--atext);font-weight:700;font-size:16px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{background:var(--soft);color:var(--atext);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}
.quick button b{font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:12px 0;font-family:var(--display);font-weight:700;font-size:23px}
.keys button:active{background:var(--soft)}
.keys .plus{font-family:var(--body);font-size:16px;color:var(--atext)}
.keys .ok{grid-column:span 2;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:20px}
.calcs{display:flex;flex-direction:column;gap:8px;max-height:52dvh;overflow-y:auto}
.calc{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:14px;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.calc .cn{width:100%;display:flex;align-items:center;gap:7px;font-weight:700}
.calc .cn span:not(.av){flex:1}
.calc .cn b{font-family:var(--display);font-size:20px}
.calc .neg{color:var(--bad)}
.stp{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.stp button{width:36px;height:36px;border-radius:10px;background:var(--cell);font-size:20px;font-weight:700;color:var(--ink)}
.stp b{min-width:26px;text-align:center;font-family:var(--display);font-size:20px;color:var(--ink)}
.menu{display:flex;flex-direction:column}
.menu button{text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px}
.menu button:last-child{border-bottom:0}
.ask{font-size:17px;font-weight:700;margin:6px 0 4px}
.win{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 0}
.win .avs{display:flex;gap:6px}
.win .wn{font-family:var(--display);font-weight:800;font-size:28px}
.win .ws{color:var(--muted);font-size:14px}
.places{display:flex;flex-direction:column}
.place{display:flex;justify-content:space-between;align-items:center;padding:8px 2px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;gap:8px}
.place > span:first-child{display:flex;align-items:center;gap:6px}
.place > span:last-child{font-weight:700;text-align:right}
.place small{font-weight:400;color:var(--muted)}
.spin{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 4px}
.spinname{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--display);font-size:30px}
table.stats{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stats th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:10px 8px;text-align:right}
.stats td{padding:9px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.stats th:first-child,.stats td:first-child{text-align:left}
.stats td:first-child{display:flex;align-items:center;gap:6px;font-weight:700}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + var(--sb));z-index:30;background:var(--ink);color:var(--screen);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:calc(100% - 40px);text-align:center}
#toast[hidden]{display:none}
/* profiles */
.phead{display:flex;align-items:center;gap:14px;padding:4px 2px}
.pname{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.pstat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column}
.pstat b{font-family:var(--display);font-weight:800;font-size:23px;font-variant-numeric:tabular-nums;line-height:1.1}
.pstat span{font-size:11px;color:var(--muted);line-height:1.2}
.trk.mini{width:56px;flex:none;height:7px}
.g > .h2h,.h2h{display:flex;flex-direction:row;align-items:center;gap:7px;flex:1;min-width:0}
.h2h b{font-family:var(--display);font-size:19px;font-variant-numeric:tabular-nums}
.h2h .gn{margin-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.up{background:color-mix(in srgb,var(--good) 18%,var(--surface));color:var(--good)}
.st.down{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--bad)}
.g > .res,.res{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex:none}
.res.w{background:var(--good);color:var(--surface)}.res.l{background:var(--cell);color:var(--muted)}
.gtxt{display:flex;flex-direction:column;flex:1;min-width:0}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.swatches button{aspect-ratio:1;border-radius:50%;border:3px solid transparent;max-width:52px}
.swatches .on{border-color:var(--ink);box-shadow:0 0 0 2px var(--surface) inset}
.st.jr{background:var(--accent);color:var(--accent-ink)}
.jrseg button{font-size:15px;padding:10px}
/* make a game */
.bigbtn.mk{background:var(--soft);border-color:transparent}
.bigbtn.mk .ico{background:var(--accent);color:var(--accent-ink)}
.note.rules{min-height:130px;line-height:1.45}
.sugg{gap:8px;border-color:var(--atext)}
.sugg ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.radios .mine{display:flex;flex-direction:column;gap:2px;border-style:dashed}
.radios .mine.on{border-style:solid}
.radios.sm button{padding:10px 14px;font-size:15px}
.opt.col{flex-direction:column;align-items:flex-start;gap:8px}
.num.wide{width:140px}
.rulestext{white-space:pre-wrap;font-size:16px;line-height:1.55;max-height:60dvh;overflow-y:auto}
/* laps */
.lapbar{padding:0 16px 6px;max-width:640px;margin:0 auto}
.laps{display:flex;flex-direction:column;gap:6px}
.lap{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--pc);border-radius:12px;padding:6px 6px 6px 10px}
.lap .ln{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70px}
.lpips{display:flex;gap:3px;flex:1;flex-wrap:wrap}
.lpips i{width:10px;height:10px;border-radius:50%;background:var(--cell);border:1px solid var(--line)}
.lpips i.on{background:var(--pc);border-color:var(--pc)}
.lap b{font-family:var(--display);font-variant-numeric:tabular-nums;font-size:16px}
.lap .lm{width:34px;height:34px;border-radius:9px;background:var(--cell);font-weight:800;font-size:18px}
.lap .lp{height:34px;padding:0 10px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;white-space:nowrap}
/* rules */
.rulesdoc{display:flex;flex-direction:column;gap:4px;max-height:66dvh;overflow-y:auto;font-size:16px;line-height:1.5;padding-right:4px}
.rulesdoc h4{font-family:var(--display);font-size:17px;margin:12px 0 2px}
.rulesdoc h4:first-child{margin-top:0}
.rulesdoc p{margin:0}
.rulesdoc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rnote{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--soft);font-size:15px}
.rnote b{display:block}
.rlink{display:block;margin-top:10px;color:var(--atext);font-weight:700}
.st.rb{background:transparent;padding:3px 2px}
/* calculator */
.calcfab{position:fixed;right:16px;bottom:calc(88px + var(--sb));z-index:7;width:58px;height:58px;border-radius:18px;background:var(--ink);color:var(--screen);display:grid;place-items:center;box-shadow:0 10px 24px -8px rgba(0,0,0,.55)}
.calcfab svg,.calcmini svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.calcfab:active{transform:scale(.94)}
.calcmini svg{width:20px;height:20px}
#calc{position:fixed;inset:0;z-index:25;background:rgba(10,12,20,.5);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
#calc[hidden]{display:none}
.calcpanel{background:var(--screen);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:12px 16px calc(16px + var(--sb));display:flex;flex-direction:column;gap:10px;max-height:94dvh;overflow-y:auto;animation:up .2s ease-out}
.ctop{display:flex;align-items:center;gap:10px}.ctop b{flex:1;font-family:var(--display);font-size:19px}
.ctop .ico{width:34px;height:34px;font-size:15px}
/* the paper tape is a real object, so it stays paper-colored in every theme */
.tape{background:#fffdf3;color:#2a2418;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;
  max-height:24dvh;min-height:84px;overflow-y:auto;padding:10px 16px 20px;border-radius:10px 10px 0 0;
  box-shadow:inset 0 6px 8px -6px rgba(0,0,0,.18);
  -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/14px 100%}
.tl{display:flex;justify-content:space-between;align-items:baseline;font-size:17px;line-height:1.5}
.tl span{color:#8d826b;min-width:22px}
.tl.tot{border-top:2px solid #2a2418;margin:3px 0 8px;padding-top:2px;font-weight:800}
.tl.tot b{font-size:21px}
.tl.empty{color:#8d826b;justify-content:center;font-family:var(--body);font-size:14px;padding-top:18px}
.tl.new{animation:print .22s ease-out}
@keyframes print{from{transform:translateY(-6px);opacity:0}}
.cdisp{display:flex;flex-direction:column;align-items:flex-end;padding:0 4px;min-height:64px}
.cdisp small{color:var(--muted);font-size:14px;min-height:18px;font-variant-numeric:tabular-nums}
.cdisp span{font-family:var(--display);font-weight:800;font-size:42px;line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-all;text-align:right}
.ckeys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ckeys button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 0;font-family:var(--display);font-weight:700;font-size:24px}
.ckeys button:active{transform:scale(.96);background:var(--soft)}
.ckeys .fn{background:var(--cell);font-size:19px}
.ckeys .op{background:var(--soft);color:var(--atext);font-size:27px}
.ckeys .eq{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:27px}
.ckeys .zero{grid-column:span 2}
.cuse{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:15px;font-family:var(--display);font-weight:800;font-size:20px}
.csend{display:flex;flex-direction:column;gap:6px}
.cchips{display:flex;gap:6px;flex-wrap:wrap}
.cchips button{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1.5px solid color-mix(in srgb,var(--pc) 50%,var(--line));border-radius:99px;padding:5px 12px 5px 5px;font-weight:700;font-size:14px}
@media (prefers-reduced-motion: reduce){#calc,.calcpanel,.tl.new{animation:none}}
/* color picker */
.preview{background:var(--surface);gap:6px}
.pvrow{display:flex;justify-content:space-between;align-items:baseline;font-size:17px}
.pvnum{font-family:var(--display);font-size:26px}
.pvbtn{background:var(--accent);color:var(--accent-ink);border-radius:12px;text-align:center;padding:10px;font-weight:800;font-family:var(--display);margin-top:4px}
.seg .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:8px}
.sw button,.sw .any{aspect-ratio:1;border-radius:50%;border:1px solid rgba(128,128,128,.4);position:relative;width:100%}
.sw button.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.sw .orig{background:var(--cell);color:var(--ink);font-size:18px;font-weight:800}
.sw .any{background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);overflow:hidden;cursor:pointer}
.sw .any input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.warn{margin:0;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:var(--ink);font-size:14px;font-weight:700}
@media (min-width:560px){.counters{grid-template-columns:repeat(3,1fr)}.counters.n2,.counters.n4{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden><div class="panel"></div></div>
<div id="calc" hidden><div class="calcpanel"></div></div>
<div id="toast" hidden role="status"></div>
<noscript>Tally needs JavaScript turned on.</noscript>
<script src="games.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
